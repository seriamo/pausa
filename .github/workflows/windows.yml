name: Windows

# Builds, tests and smoke-tests Pausa for Windows. Pushing a windows-v<version> tag also
# publishes a GitHub release. Windows releases are never marked "latest": the macOS app's
# update check and the README's Pausa.dmg link both read /releases/latest.

on:
  push:
    branches: ['**']
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    # Release tags run in an environment so one Azure federated credential
    # (subject repo:<owner>/<repo>:environment:windows-release) covers every release.
    environment: ${{ startsWith(github.ref, 'refs/tags/windows-v') && 'windows-release' || '' }}
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/windows-v') && vars.AZURE_SIGNING_ACCOUNT != '' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content windows/Directory.Build.props
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $version) { throw 'No <Version> in windows/Directory.Build.props' }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "windows-v$version") {
            throw "Tag ${{ github.ref_name }} does not match windows/Directory.Build.props version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Pausa for Windows $version"

      - name: Test
        run: dotnet test windows/Pausa.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish windows/src/Pausa.Windows/Pausa.Windows.csproj -c Release -r "win-$arch" -o "windows/artifacts/publish/win-$arch"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Get-ChildItem windows/artifacts/publish -Recurse -File | Format-Table FullName, Length

      - name: Smoke test (x64)
        shell: pwsh
        env:
          PAUSA_FAKE_UPDATE: '9.9'
        run: |
          $dir = Join-Path $PWD 'windows/smoke'
          $exe = Join-Path $PWD 'windows/artifacts/publish/win-x64/Pausa.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test', "`"$dir`"" -Wait -PassThru
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length
          if (Test-Path "$dir/report.json") { Get-Content "$dir/report.json" }
          if (Test-Path "$dir/crash.txt") { Get-Content "$dir/crash.txt" }
          $log = Join-Path $env:LOCALAPPDATA 'Seriamo/Pausa/pausa.log'
          if (Test-Path $log) { New-Item -ItemType Directory -Force $dir | Out-Null; Copy-Item $log $dir; Get-Content $log -Tail 50 }
          if ($p.ExitCode -ne 0) { throw "Smoke test exited with $($p.ExitCode)" }

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-x64
          path: windows/smoke
          if-no-files-found: warn

      - name: Azure login (signing)
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Pausa.exe
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\windows\artifacts\publish\win-x64\Pausa.exe
            ${{ github.workspace }}\windows\artifacts\publish\win-arm64\Pausa.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Pausa
          description-url: https://seriamo.com

      - name: Build installers
        shell: pwsh
        run: |
          $paths = "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe"
          $iscc = Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = Get-ChildItem $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) not found' }
          Write-Host "Using $($iscc.FullName)"
          $version = '${{ steps.version.outputs.version }}'
          foreach ($arch in 'x64', 'arm64') {
            & $iscc.FullName /Q "/DAppVersion=$version" "/DArch=$arch" windows/installer/Pausa.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Copy-Item "windows/artifacts/publish/win-$arch/Pausa.exe" "windows/artifacts/dist/Pausa-$arch.exe"
          }

      - name: Installer round trip (x64)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $p = Start-Process 'windows/artifacts/dist/Pausa-Setup-x64.exe' -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOLAUNCH', '/TASKS=startup', "/LOG=`"$log`""
          if ($p.ExitCode) { Get-Content $log -Tail 40; throw "Setup exited with $($p.ExitCode)" }

          $app = Join-Path $env:LOCALAPPDATA 'Programs\Pausa'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (-not (Test-Path "$app\Pausa.exe")) { throw "Pausa.exe not installed to $app" }
          $run = Get-ItemPropertyValue $runKey -Name Pausa
          if ($run -ne "`"$app\Pausa.exe`"") { throw "Unexpected Run value: $run" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Pausa.lnk'))) { throw 'Start menu shortcut missing' }
          if (Get-Process Pausa -ErrorAction SilentlyContinue) { throw 'Setup started Pausa despite /NOLAUNCH' }
          Write-Host "Installed to $app; Run = $run"

          # Uninstall while a (network-free) smoke-test instance runs: it must be closed and cleaned up.
          Start-Process "$app\Pausa.exe" -ArgumentList '--smoke-test', "`"$env:RUNNER_TEMP\smoke-installed`""
          Start-Sleep -Seconds 3
          # The uninstaller re-launches itself from %TEMP% and exits, so poll for its Uninstall key to go.
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C95DD07F-9CA3-4C88-9A05-FDB6D59C7F2A}_is1'
          if (-not (Test-Path $uninstKey)) { throw 'Uninstall registration missing' }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path $uninstKey) -or (Test-Path "$app\Pausa.exe")); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          if (Test-Path $uninstKey) { throw 'Uninstall did not finish within 60s' }
          if (Test-Path "$app\Pausa.exe") { throw 'Pausa.exe still present after uninstall' }
          if (Get-Process Pausa -ErrorAction SilentlyContinue) { throw 'Pausa still running after uninstall' }
          if ((Get-ItemProperty $runKey).PSObject.Properties.Name -contains 'Pausa') { throw 'Run value left behind' }
          Write-Host 'Uninstall removed the app, its process and the Run value'

      - name: Sign installers
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\windows\artifacts\dist\Pausa-Setup-x64.exe
            ${{ github.workspace }}\windows\artifacts\dist\Pausa-Setup-arm64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Pausa Setup
          description-url: https://seriamo.com

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location windows/artifacts/dist
          Get-ChildItem *.exe | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Get-ChildItem | Format-Table Name, Length
          foreach ($f in Get-ChildItem *.exe) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: pausa-windows-${{ steps.version.outputs.version }}
          path: windows/artifacts/dist
          if-no-files-found: error

  # Launch-and-run check for the Arm build. The windows-11-arm image sits on the first-run
  # privacy screen with no taskbar, so its screenshots aren't meaningful; x64 does the visuals.
  smoke-arm64:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pausa-windows-${{ needs.build.outputs.version }}
          path: dist

      - name: Smoke test (arm64)
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'smoke'
          $p = Start-Process -FilePath (Join-Path $PWD 'dist/Pausa-arm64.exe') -ArgumentList '--smoke-test', "`"$dir`"" -Wait -PassThru
          if (Test-Path "$dir/report.json") { Get-Content "$dir/report.json" }
          if (Test-Path "$dir/crash.txt") { Get-Content "$dir/crash.txt" }
          if ($p.ExitCode -ne 0) { throw "Smoke test exited with $($p.ExitCode)" }

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-arm64
          path: smoke
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: [build, smoke-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pausa-windows-${{ needs.build.outputs.version }}
          path: dist

      - name: Create release (not latest)
        run: |
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          cat > notes.md <<EOF
          Pausa for Windows $VERSION. Needs Windows 10 (version 1809) or later; Windows 11 recommended.

          | | Intel / AMD (x64) | Arm (Snapdragon) |
          |---|---|---|
          | **Installer** (recommended) | [Pausa-Setup-x64.exe]($base/Pausa-Setup-x64.exe) | [Pausa-Setup-arm64.exe]($base/Pausa-Setup-arm64.exe) |
          | Portable, no install | [Pausa-x64.exe]($base/Pausa-x64.exe) | [Pausa-arm64.exe]($base/Pausa-arm64.exe) |

          Looking for the Mac app? Get [Pausa.dmg](https://github.com/$GH_REPO/releases/latest/download/Pausa.dmg).
          EOF
          gh release create "$TAG" dist/* --title "Pausa for Windows $VERSION" --notes-file notes.md --latest=false

      - name: Keep the macOS release as latest
        run: |
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          echo "releases/latest -> $latest"
          if [[ "$latest" == windows-v* ]]; then
            mac=$(gh api "repos/$GH_REPO/releases?per_page=50" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("windows-v") | not))][0].tag_name')
            gh release edit "$mac" --latest
            echo "::warning::releases/latest pointed at $latest; restored $mac"
          fi
